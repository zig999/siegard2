# An example project standard, transcribed from oldisegard/skills/u-be-standards/SKILL.md.
#
# This file is NOT part of the distribution. It sits under src/standards/ rather than
# src/claude/, so no assembly ships it: Siegard ships the slot a standard fits into and the
# enforcement that holds code to it, never the content. A consumer project owns its own
# registry, in its own repository, and names it when invoking the review.
#
# Two lines run through it, and both are the point.
#
# `decided_by` splits the registry in half. A rule a linter, a compiler or a secret scanner
# decides exactly is a step of the project's own suite — it runs through bin/run.py, its failures
# arrive as a captured run, and the failures pass reads what the tool printed. Only a rule whose
# application is a reading reaches the standard pass. A model applying `no-explicit-any` to a
# five-hundred-line file has strictly worse recall than tsc and costs more.
#
# `elsewhere` says what this registry does not hold, and where each of those lives instead. Three
# homes, and the boundary between them is where a first draft of this file got it wrong. An error's
# identity is what the business decided, so it belongs to the knowledge base as a domain error whose
# node identifier is its name — a code written in source that no bound node holds is what the
# base-conformance pass exists to report, so naming codes here would require exactly what that pass
# reports. But which transport status such an error maps to is not a domain fact either: two
# projects map the same error differently. That is this project's decision, so COR-04 below requires
# the mapping to live in one place without stating any mapping, and the table is code in the place
# it names.

contract_version: siegard-standard/1
standard: backend-typescript
summary: How this project's TypeScript services are layered, wired, validated and named.

rules:

  # ---------------------------------------------------------------- layering and wiring

  - id: ARC-01
    statement: A constructor receives interfaces, never concrete implementations.
    because: A class bound to a concrete collaborator cannot be exercised without it, so the test
      has to stand up the collaborator's world to assert one line of this one.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }
    seen_at: src/orders/order.service.ts

  - id: ARC-02
    statement: A service or controller never constructs a dependency; instantiation happens only
      inside a factory function.
    because: Wiring scattered through the layers has no single place to change, so swapping an
      implementation means finding every construction that named it.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }
    seen_at: src/factories/order.factory.ts

  - id: ARC-03
    statement: Each module wires itself in one factory function under src/factories/, named
      <resource>.factory.ts.
    because: A module whose wiring point cannot be found from its path is a module nobody can
      re-wire with confidence.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src/factories, suffix: .ts }
    seen_at: src/factories/order.factory.ts

  - id: ARC-04
    statement: Business logic lives in a service; a controller maps transport to a call and back,
      and a repository only reads and writes.
    because: A rule implemented in a controller is a rule that only exists over HTTP, and it will
      be reimplemented the day a queue or a job needs it.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }

  - id: ARC-05
    statement: A DTO is declared under a dto directory, never inline in a controller.
    because: A shape declared where it is used is a shape the next caller redeclares slightly
      differently, and neither copy is the contract.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
    seen_at: src/dto/create-order.dto.ts

  # ---------------------------------------------------------------- input and validation

  - id: DTO-01
    statement: Validation happens at the route or middleware boundary; a service receives a typed
      DTO and never a raw request body.
    because: A service that validates its own input validates it differently at each entry point,
      and the one nobody remembered is the one that accepts anything.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .routes.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }
    seen_at: src/routes/order.routes.ts

  - id: DTO-02
    statement: A DTO schema is a Zod object plus the type inferred from it.
    because: A hand-written type beside a schema drifts from it silently, and the compiler cannot
      tell you which of the two the request actually satisfied.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .dto.ts, nested: true }
    seen_at: src/dto/create-order.dto.ts

  - id: DTO-03
    statement: A DTO is named for its use case — Create<Resource>Schema and Create<Resource>Dto in
      create-<resource>.dto.ts, and likewise for Update, Response and Query.
    because: A reader looking for the shape a route accepts should find it from the route's name
      alone, without opening three files to see which one it was.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .dto.ts, nested: true }

  - id: DTO-04
    statement: A test imports the DTO schema from the dto directory instead of redefining it.
    because: A schema redefined in a test passes against a shape production never accepted, so the
      test proves the copy rather than the contract.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .spec.ts, nested: true }
      - { under: src/__tests__, suffix: .ts, nested: true }

  # ---------------------------------------------------------------- the shape of a response

  - id: API-01
    statement: A paginated response is the shared PaginatedResponse type imported from
      src/types/pagination.ts, never redeclared per module.
    because: Two declarations drift, and the day they disagree nobody can say which one the API
      promised.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .dto.ts, nested: true }
      - { under: src/types, suffix: .ts }
    seen_at: src/types/pagination.ts

  - id: API-02
    statement: An empty list answers with the paginated envelope carrying an empty data array,
      never with an absent value.
    because: A caller that has to test for absence before iterating will forget once, and the
      failure lands in the caller rather than here.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }

  - id: API-03
    statement: Offset pagination always computes the page count from the total and the limit, and
      never hardcodes or omits it.
    because: A page count the client computes itself is a page count that disagrees with the one
      the server would have given.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }

  - id: API-04
    statement: A page limit is bounded by a configured maximum, and neither the default nor the
      maximum is written in source.
    because: An unbounded limit is a denial of service with a query string, and a bound written in
      source is one nobody can raise without a deploy.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .routes.ts, nested: true }

  - id: API-05
    statement: An error answers in one envelope, carrying a code, a message and its details.
    because: A client that has to branch on the shape of the error cannot handle an error it has
      not seen before.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .middleware.ts, nested: true }

  - id: API-06
    statement: A route sits under a versioned prefix.
    because: An unversioned route cannot be changed without breaking whoever already calls it.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .routes.ts, nested: true }

  # ---------------------------------------------------------------- how failure is raised

  - id: COR-01
    statement: A catch either handles the error or rethrows it wrapped with the original as its
      cause; an empty catch is forbidden.
    because: A swallowed error is a failure nobody will ever see, and the symptom surfaces
      somewhere with no trace back to here.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: COR-02
    statement: A failure raises a typed error class carrying a name, a message, its status and a
      context field, never a generic error with a sentence in it.
    because: A generic error cannot be mapped to a response or handled by a caller, so every layer
      above has to match on its message.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }
    seen_at: src/errors/not-found.error.ts

  - id: COR-04
    statement: Every domain error maps to a transport status in one place, and no handler chooses a
      status inline.
    because: A status chosen where it is answered is a status chosen differently at the next
      endpoint, and the one nobody remembers is the one a client branches on.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .middleware.ts, nested: true }
      - { under: src/errors, suffix: .ts, nested: true }
    seen_at: src/errors/status-map.ts

  - id: COR-03
    statement: A service raises business errors, a repository raises data errors, and the error
      middleware formats whatever reaches it.
    because: An error mapped to a transport status inside a service makes the service unusable
      outside that transport.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }
      - { under: src, suffix: .middleware.ts, nested: true }

  - id: EDG-01
    statement: Absent and empty input is refused at the validation boundary, before the service is
      reached.
    because: A service that receives input nothing validated has to validate it, and then two
      places decide what is acceptable.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .routes.ts, nested: true }
      - { under: src, suffix: .middleware.ts, nested: true }

  - id: EDG-02
    statement: A resource that does not exist is refused through a typed error raised in the
      service, never by letting a driver or generic error reach the client.
    because: An internal failure shown to a client tells it to retry something that will never
      succeed, and tells a stranger the shape of the store.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .controller.ts, nested: true }

  - id: EDG-03
    statement: A uniqueness violation is caught where it is raised and answered through a typed
      error; it never reaches the default error handler as a driver error.
    because: A constraint error arriving as an internal failure exposes the schema and reads as a
      bug in the server rather than a conflict in the request.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }

  - id: EDG-04
    statement: An operation attempted against state that forbids it is refused through a typed
      error raised before any write.
    because: A refusal raised after a partial write leaves the store in a state the refusal claims
      never happened.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }

  - id: EDG-05
    statement: A write spanning more than one statement runs in a transaction that rolls back as a
      whole.
    because: A half-applied write leaves data no code path expects to find, and nothing later will
      tell you when it happened.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .service.ts, nested: true }
      - { under: src, suffix: .repository.ts, nested: true }

  - id: EDG-06
    statement: A payload above the configured size limit is refused at the middleware boundary.
    because: A body read into memory before it is measured is a body that can exhaust the process.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .middleware.ts, nested: true }
      - { under: src/config, suffix: .ts }

  - id: EDG-07
    statement: A rate limit is applied at the boundary, and its refusal tells the caller when to
      try again.
    because: A refusal that does not say when to retry turns every client into a tight retry loop.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .middleware.ts, nested: true }
      - { under: src, suffix: .routes.ts, nested: true }

  - id: EDG-08
    statement: A dependency that is unavailable, slow or answers in an unexpected shape is handled
      as an error rather than allowed to crash the process.
    because: A dependency's bad day should degrade one endpoint, not take down everything the
      process serves.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .repository.ts, nested: true }
      - { under: src/clients, suffix: .ts, nested: true }

  # ---------------------------------------------------------------- what must not leak

  - id: SEC-01
    statement: Authorization is checked in the handler against the specific resource, never
      inferred from the presence of a valid credential.
    because: An identifier in a URL is not authorization, and a handler that only checks the
      credential hands out every row by counting.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .controller.ts, nested: true }
      - { under: src, suffix: .service.ts, nested: true }

  - id: SEC-02
    statement: Every database statement is parameterized; no query is built by concatenating or
      interpolating input.
    because: One interpolated value is a full read of the store, and the value that reaches it is
      not the one you tested with.
    decided_by: tool
    tool: secret-scan
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: SEC-03
    statement: No credential, token, secret or environment URL is written in source.
    because: A secret in source is a secret in every clone, every fork and every log of the clone.
    decided_by: tool
    tool: secret-scan
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: SEC-04
    statement: No secret, stack trace or internal detail reaches a log or a client response.
    because: A log is read by more people than the store is, and a stack trace tells a stranger the
      shape of the thing they are attacking.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  # ---------------------------------------------------------------- the code itself

  - id: TYP-01
    statement: The compiler runs strict, and the escape-hatch any type is never used; prefer
      unknown, a generic, or an explicit type.
    because: One escape hatch propagates through every call it touches, and the errors it hides
      surface at runtime in a caller that never mentioned it.
    decided_by: tool
    tool: typecheck
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: TYP-02
    statement: A type assertion is accompanied by a guard that narrows it.
    because: An assertion is a claim the compiler stops checking, so the first wrong one is found
      by a user.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: TYP-03
    statement: A public signature declares its parameter and return types explicitly.
    because: An inferred public type changes when the body changes, so a caller breaks from an edit
      nobody thought was a contract change.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: TYP-04
    statement: A value with meaning is a named constant, not a number or string spelled out where
      it is used.
    because: The same literal in three places is three places to change and two to forget.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: CON-01
    statement: Files are kebab-case, classes and types PascalCase, functions and variables
      camelCase, constants and environment variables screaming snake case, interfaces PascalCase
      prefixed with I, database tables snake_case plural and columns snake_case, routes kebab-case
      plural.
    because: A name that does not say what kind of thing it is costs a reader an extra file open,
      every time.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: MNT-01
    statement: A function stays within thirty lines and takes at most three positional parameters;
      beyond that, extract a named helper or pass an object.
    because: A function nobody can hold in their head is a function that gets a fourth branch
      instead of a second function.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: MNT-02
    statement: Commented-out code is deleted, and unused imports are removed.
    because: Code kept in a comment is code nobody maintains and everybody trusts, and it is read
      as intent long after it stopped compiling.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: MNT-03
    statement: A block of logic that already exists somewhere in this project is called, not
      copied.
    because: Two copies of one rule diverge on the day one of them is fixed, and the reader of the
      other has no way to know it was.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: PRH-01
    statement: Production code logs through the configured logger; console output is not used.
    because: A console line goes nowhere in production — no level, no correlation, no retention.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: PRH-02
    statement: A deferred-work marker carries a reference to the work that will settle it.
    because: An unreferenced marker is a decision deferred to nobody, and it survives every review
      by looking temporary.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: PRH-03
    statement: A lint rule is suppressed only with a comment stating why.
    because: A silent suppression removes the rule for everyone who reads the line afterwards.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src, suffix: .ts, nested: true }

  - id: PRH-04
    statement: A migration that destroys or alters data ships with a reverse migration beside it.
    because: A migration you cannot reverse turns a bad deploy into a restore from backup.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src/migrations, suffix: .ts, nested: true }

  # ---------------------------------------------------------------- how tests are written here

  - id: TST-01
    statement: A test arranges, then acts, then asserts, in that order and visibly.
    because: A test whose setup and assertions are interleaved cannot be read to find out what it
      actually claims.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .spec.ts, nested: true }
      - { under: src/__tests__, suffix: .ts, nested: true }

  - id: TST-02
    statement: A test is named for the behavior it expects, as a sentence.
    because: A run's output is a list of test names, and a name like "works" tells the reader of a
      failure nothing at all.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .spec.ts, nested: true }
      - { under: src/__tests__, suffix: .ts, nested: true }

  - id: TST-03
    statement: A stand-in stands in for a boundary — the store, the network, the filesystem, an
      external service — and never for business logic.
    because: A rule replaced by a stand-in is a rule the suite asserts about itself, and it passes
      after the real rule is deleted.
    decided_by: reading
    applies_to:
      - { under: src, suffix: .spec.ts, nested: true }
      - { under: src/__tests__, suffix: .ts, nested: true }

  - id: TST-04
    statement: A test file mirrors the path of the unit under test, under src/__tests__/ with unit
      and integration subtrees.
    because: A test nobody can find from the file it covers is a test that gets written twice and
      deleted once.
    decided_by: tool
    tool: lint
    applies_to:
      - { under: src/__tests__, suffix: .ts, nested: true }

# What this standard deliberately does not hold, so a reader does not read an absence as an
# oversight. Each is owned somewhere else, and stating it twice would create a second home that
# drifts.
elsewhere:

  - what: Which errors exist and what each one names — the duplicate registration, the invalid
      order total, the expired credential.
    lives_in: The knowledge base, as definitions whose kind is a domain error, where the node's own
      identifier is the error's name.
    why: An error's identity is what the business decided, and a code written in source that no
      bound node holds is the archetypal base-conformance finding. Naming them here would require
      in code exactly what that pass exists to report.

  - what: Which transport status each of those errors maps to — 404, 409, 422, 401, 403, 429, 201,
      204.
    lives_in: This file, in COR-04, which requires the mapping to live in one place — and that
      place, in code.
    why: This is the entry that was wrong until it was rewritten, and the mistake is worth keeping
      visible. A status is transport, and the knowledge base excludes transport, so sending these
      there sent them to a home that refuses them and they lived nowhere at all. But which status a
      domain error maps to is not a domain fact either — two projects map the same error differently.
      It is this project's decision about how it answers. So the rule above states where the mapping
      belongs without stating any mapping, the table is code in the place it names, and the three
      passes stop disagreeing — the base has the errors, this file requires one map, and the code
      holds it.

  - what: Who may see which resource, beyond the requirement that the check happen against the
      resource itself.
    lives_in: The knowledge base, as rule nodes.
    why: An authorization outcome is a domain decision. SEC-01 above says where the check belongs;
      what it decides is not this file's.

  - what: Falsifying the cause of a timeout, a flake or a performance finding — reproducing it in
      isolation and then under load, varying the knob, and recording whether the cause was verified
      or only inferred.
    lives_in: Nowhere, and deliberately.
    why: The skill this was transcribed from carried it as a procedure that *executes*, and no agent
      of this framework holds a shell. A read-only agent writing a confidence label restores the
      label of an unfalsified cause rather than the falsification, and having a reviewer commission
      a second run would let it choose what runs next. What was portable is already in the delivery
      contract, which forces the cause that constrains more where nothing settles it.

  - what: Which tests must exist for a task, by the kind of work it is — a new behavior, a change,
      a rearrangement, a defect.
    lives_in: The framework, in agents/test-author.md.
    why: It is the same question in every language, so it is not this project's to answer.

  - what: That a test asserts observable behavior rather than an internal call, fails for one
      reason, cannot pass vacuously, tears down what it sets up, and treats an error path as a
      behavior.
    lives_in: The framework, in agents/test-author.md and agents/coverage-auditor.md.
    why: Universal, and already enforced by the passes that read the tests. The TST rules above add
      only what is this project's taste — the order inside a test, how it is named, what a stand-in
      may replace.

  - what: Which edge cases a task must account for, and the requirement to say why a dismissed one
      does not apply.
    lives_in: The framework, in agents/test-author.md.
    why: The checklist is behavior-shaped and universal. What this registry adds is where each one
      is handled here — the EDG rules above.

  - what: Whether every acceptance criterion has a test that would fail if it stopped holding.
    lives_in: The framework, in agents/coverage-auditor.md.
    why: It is judged against the task's criteria, which live in the plan, not against a rule here.

  - what: A severity for any of these rules, and any verdict derived from the findings.
    lives_in: Nowhere — deliberately.
    why: The registry this comes from graded each finding from critical to low and fed the grade to
      an approval gate, which made the reviewer the gate. A finding states what it costs; a person
      decides what that means.

  - what: Whether two modules import each other in a cycle.
    lives_in: Nowhere yet — a declared gap.
    why: It is decidable by walking the import graph, so it belongs to a script rather than to a
      rule an agent judges. No such script ships, and stating the rule here would hand a mechanical
      question to a reading.

  - what: The shape of a commit message, and which branch work happens on.
    lives_in: The project's own git conventions, outside this framework.
    why: Siegard never touches the consumer's git state, and a rule here could not be checked by
      reading the files a review is given.
