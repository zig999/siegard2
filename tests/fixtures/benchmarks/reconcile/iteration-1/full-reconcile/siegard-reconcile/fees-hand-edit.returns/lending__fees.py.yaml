    held_at: >-
      the constant FEE_CENTS_PER_OVERDUE_DAY, line 3, and the overdue branch of late_fee_cents(),
      lines 8-11
    evidence: >-
      FEE_CENTS_PER_OVERDUE_DAY = 100 / overdue_days = (loan.returned_on - loan.due_on).days /
      if overdue_days <= 0: return 0 / return overdue_days * FEE_CENTS_PER_OVERDUE_DAY
