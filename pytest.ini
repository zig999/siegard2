[pytest]
# The suite is `tests/` and nothing else. Without this, a bare `pytest` at the repository root walks
# the whole tree and tries to collect whatever looks like a test anywhere in it — including the
# source a delivery round writes into a fixture project's own `src/` under `temp/`. Those files are
# the fixture's tests, written against the fixture's tree; collecting them here fails, and it fails
# in a way that reads as this repository's suite breaking. Naming the path keeps the documented
# command honest.
testpaths = tests

# The suite runs across every core by default: each test builds its own fixture repository under its
# own tmp_path, so no two share state, and the run takes about five minutes in parallel against
# thirteen to eighteen serially on the same machine. `-n 0` runs it in one process, for a debugger
# or a test that prints.
addopts = -n auto
