$schema: "http://json-schema.org/draft-07/schema#"
$id: "u-shared-templates/worker-return-envelope.schema.yaml"
title: worker-return-envelope
description: >
  The v3 worker->orchestrator contract. A worker's FINAL assistant message is
  exactly one fenced json block containing this envelope — nothing after it.
  The spawning orchestrator extracts the last fenced json block from the Agent
  call's return text and ingests it with orch-log/scripts/conclude.py, which
  validates it, notarizes declared artifacts (sha256), and appends the terminal
  event (task_completed / task_failed) as the log's single writer. Workers
  never write to the log. Conditional rules enforced by conclude.py (not
  expressible structurally): error is REQUIRED when status=failed; blocked is
  REQUIRED when status=blocked; artifacts is REQUIRED when status=completed
  (may be empty); verdict is REQUIRED for verdict task types (spec-reviewer,
  spec-validator, qa) and must be absent otherwise. The envelope carries
  paths and verdicts only — never file content, logs, or diffs.
type: object
required:
  - envelope
  - task_id
  - attempt
  - phase
  - status
  - summary
additionalProperties: false
properties:
  envelope:
    type: string
    const: "siegard-worker-return/v1"
    description: "Contract identifier + version. Exactly this literal."
  task_id:
    type: string
    description: "The task id received in the spawn prompt, verbatim."
  attempt:
    type: integer
    minimum: 1
    description: "The attempt number received in the spawn prompt, verbatim."
  phase:
    type: string
    enum: [sdd, dev, review, test, reverse-spec]
    description: "The phase received in the spawn prompt."
  status:
    type: string
    enum: [completed, failed, blocked]
    description: >
      completed = work done, artifacts on disk. failed = execution started but
      could not finish (error object explains). blocked = required inputs
      absent or precondition unmet — retry cannot fix it (blocked object
      explains; maps to task_failed retryable:false + escalation).
  summary:
    type: string
    maxLength: 200
    description: "One line, <= 200 chars. What happened — no narrative."
  artifacts:
    type: array
    items:
      type: string
    description: >
      Project-root-relative paths of files this worker created or updated.
      Required when status=completed (empty array is valid for workers that
      produce no files). conclude.py computes sha256 per existing file
      (notarization — PROV) and warns on paths that are not regular files.
  verdict:
    type: string
    enum: [approved, revision_needed, rejected]
    description: >
      REQUIRED for verdict task types (spec-reviewer, spec-validator, qa);
      must be ABSENT for all other workers. Values match the pre-v3 event
      vocabulary. For QA workers the qa-report file remains the gate's source
      of truth; the orchestrator cross-checks this field against it.
  metrics:
    type: object
    description: "Optional worker-defined counters (e.g. findings by severity)."
  error:
    type: object
    required: [reason, retryable]
    additionalProperties: false
    description: "REQUIRED when status=failed; absent otherwise."
    properties:
      reason:
        type: string
        enum:
          - missing_input_spec_files
          - schema_violation
          - validation_failed
          - requirement_missing
          - improve_scope_missing
          - internal_error
          - dev_impact:stop_domain_task_contracts
        description: "Closed enum — the worker-emittable subset of failure reasons."
      retryable:
        type: boolean
        description: "false when a retry with identical inputs cannot succeed."
      detail:
        type: string
        description: "Optional single objective sentence."
  blocked:
    type: object
    required: [reason, required_action]
    additionalProperties: false
    description: "REQUIRED when status=blocked; absent otherwise."
    properties:
      reason:
        type: string
        enum: [missing_input, dependency, infeasibility]
        description: "Same vocabulary as blocked-report.schema.yaml."
      missing_inputs:
        type: array
        items:
          type: object
          required: [field, expected]
          additionalProperties: false
          properties:
            field:
              type: string
            expected:
              type: string
            source:
              type: string
      required_action:
        type: string
        description: "What must happen before a re-dispatch can succeed."
      escalate_to:
        type: string
        enum: [orchestrator, human]
